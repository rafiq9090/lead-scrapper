    <!-- Pitch Email Modal -->
    <div id="pitch-modal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <div>
                    <h3 id="modal-company-title" style="font-size: 1.15rem; font-weight: 700;">Cold Outreach Pitch</h3>
                    <p id="modal-company-email" style="font-size: 0.8rem; color: var(--text-secondary);"></p>
                </div>
                <button class="close-btn" onclick="closePitchModal()" style="font-size: 0.85rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em;">Close</button>
            </div>
            <div class="modal-body">
                <div>
                    <label style="font-size: 0.75rem; font-weight: 600; color: var(--text-secondary); text-transform: uppercase;">Subject Line</label>
                    <input type="text" id="modal-subject" class="input-box" style="width: 100%; margin-top: 0.25rem;" readonly>
                </div>
                <div>
                    <label style="font-size: 0.75rem; font-weight: 600; color: var(--text-secondary); text-transform: uppercase;">Personalized Email Pitch</label>
                    <div id="modal-body-text" class="pitch-preview" style="margin-top: 0.25rem;"></div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closePitchModal()">Close</button>
                <button class="btn btn-primary" id="copy-pitch-btn" onclick="copyPitchToClipboard()">
                    Copy Email Pitch
                </button>
            </div>
        </div>
    </div>
